<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرورگر من — جستجوی چندموتوره</title>
<style>
  :root{
    --bg1:#070b14;
    --bg2:#0f1729;
    --card:rgba(255,255,255,.06);
    --card2:rgba(255,255,255,.09);
    --brd:rgba(255,255,255,.12);
    --text:#eaf0ff;
    --muted:#93a0bd;
    --accent:#4f8cff;
    --accent2:#7c5cff;
    --shadow:rgba(0,0,0,.45);
  }
  [data-theme="light"]{
    --bg1:#eef2fb;
    --bg2:#dfe7f7;
    --card:rgba(255,255,255,.75);
    --card2:rgba(255,255,255,.95);
    --brd:rgba(10,20,50,.12);
    --text:#0d1626;
    --muted:#5b6b8c;
    --shadow:rgba(20,40,90,.18);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(79,140,255,.28), transparent 60%),
      radial-gradient(800px 500px at 85% 110%, rgba(124,92,255,.26), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    transition:background .4s, color .3s;
  }

  /* ---------- هدر ---------- */
  .header{
    text-align:center;
    margin-bottom:28px;
    animation:fadeUp .6s ease both;
  }
  .logo{
    width:64px;height:64px;
    margin:0 auto 14px;
    display:grid;place-items:center;
    font-size:30px;
    border-radius:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 14px 40px rgba(79,140,255,.35);
  }
  h1{
    font-size:26px;
    margin:0 0 6px;
    font-weight:800;
    letter-spacing:-.3px;
  }
  .sub{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }

  /* ---------- جعبه جستجو ---------- */
  .searchbox{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    max-width:760px;
    padding:8px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--brd);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 18px 50px var(--shadow);
    transition:border-color .25s, box-shadow .25s, transform .25s;
    animation:fadeUp .6s .05s ease both;
  }
  .searchbox:focus-within{
    border-color:rgba(79,140,255,.65);
    box-shadow:0 0 0 4px rgba(79,140,255,.16), 0 18px 50px var(--shadow);
    transform:translateY(-2px);
  }
  .engine-badge{
    flex:0 0 auto;
    width:42px;height:42px;
    border-radius:14px;
    display:grid;place-items:center;
    font-weight:800;
    font-size:16px;
    color:#fff;
    background:var(--accent);
    transition:background .25s;
  }
  #q{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:16px;
    padding:10px 4px;
  }
  #q::placeholder{color:var(--muted)}
  .go{
    flex:0 0 auto;
    border:0;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    color:#fff;
    padding:12px 22px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 22px rgba(79,140,255,.35);
    transition:transform .18s, filter .18s;
  }
  .go:hover{transform:translateY(-1px);filter:brightness(1.08)}
  .go:active{transform:translateY(1px) scale(.98)}

  /* ---------- موتورها ---------- */
  .engines{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    max-width:780px;
    margin:26px auto 0;
    animation:fadeUp .6s .12s ease both;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px 8px 10px;
    border-radius:999px;
    background:var(--card);
    border:1px solid var(--brd);
    color:var(--muted);
    font-family:inherit;
    font-size:13.5px;
    cursor:pointer;
    transition:.22s;
    backdrop-filter:blur(10px);
  }
  .chip:hover{
    color:var(--text);
    transform:translateY(-2px);
    background:var(--card2);
  }
  .chip.active{
    color:#fff;
    border-color:transparent;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 28px rgba(79,140,255,.35);
  }
  .chip .dot{
    width:24px;height:24px;
    border-radius:50%;
    display:grid;place-items:center;
    font-size:11.5px;
    font-weight:800;
    color:#fff;
    flex:0 0 auto;
  }

  /* ---------- نوار پایین ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:26px;
    flex-wrap:wrap;
    justify-content:center;
    animation:fadeUp .6s .2s ease both;
  }
  .switch{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    padding:8px 14px;
    border-radius:999px;
    background:var(--card);
    border:1px solid var(--brd);
  }
  .switch input{display:none}
  .track{
    width:38px;height:21px;
    border-radius:999px;
    background:rgba(128,145,180,.35);
    position:relative;
    transition:.25s;
    flex:0 0 auto;
  }
  .track::after{
    content:"";
    position:absolute;
    top:3px;right:3px;
    width:15px;height:15px;
    border-radius:50%;
    background:#fff;
    transition:.25s;
  }
  .switch input:checked + .track{background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .switch input:checked + .track::after{right:20px}

  .icon-btn{
    width:40px;height:40px;
    display:grid;place-items:center;
    border-radius:12px;
    border:1px solid var(--brd);
    background:var(--card);
    color:var(--text);
    font-size:17px;
    cursor:pointer;
    transition:.2s;
  }
  .icon-btn:hover{background:var(--card2);transform:translateY(-2px)}

  .hint{
    margin-top:16px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
    line-height:1.9;
    animation:fadeUp .6s .25s ease both;
  }
  kbd{
    font-family:inherit;
    font-size:11px;
    padding:2px 7px;
    border-radius:6px;
    background:var(--card2);
    border:1px solid var(--brd);
  }

  /* ---------- پنجره نمایش داخلی ---------- */
  .frame-wrap{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    background:var(--bg1);
    animation:fadeIn .25s ease both;
  }
  .frame-wrap[hidden]{display:none}
  .frame-bar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background:var(--card2);
    border-bottom:1px solid var(--brd);
    backdrop-filter:blur(14px);
  }
  .frame-url{
    flex:1;
    font-size:12.5px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    direction:ltr;
    text-align:left;
    padding:8px 12px;
    border-radius:10px;
    background:var(--card);
  }
  .frame-btn{
    font-family:inherit;
    font-size:13px;
    text-decoration:none;
    color:var(--text);
    padding:9px 14px;
    border-radius:10px;
    border:1px solid var(--brd);
    background:var(--card);
    cursor:pointer;
    white-space:nowrap;
    transition:.2s;
  }
  .frame-btn:hover{background:rgba(79,140,255,.2)}
  .frame-btn.close{
    color:#fff;
    background:linear-gradient(135deg,#ff5f6d,#ff2e63);
    border-color:transparent;
    font-weight:700;
  }
  iframe{
    flex:1;
    width:100%;
    border:0;
    background:#fff;
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  @media (max-width:560px){
    h1{font-size:21px}
    .go{padding:12px 16px;font-size:14px}
    .engine-badge{width:38px;height:38px}
    .chip{font-size:12.5px;padding:7px 12px 7px 9px}
  }
</style>
</head>
<body>

  <div class="header">
    <div class="logo">🌐</div>
    <h1>مرورگر من</h1>
    <p class="sub">یک موتور جستجو را انتخاب کن و جستجو کن</p>
  </div>

  <form class="searchbox" id="searchForm" autocomplete="off">
    <span class="engine-badge" id="engineBadge">G</span>
    <input id="q" type="text" placeholder="جستجو کن یا یک آدرس بنویس…" spellcheck="false">
    <button class="go" type="submit">جستجو</button>
  </form>

  <div class="engines" id="engineList"></div>

  <div class="toolbar">
    <label class="switch">
      <input type="checkbox" id="embedToggle">
      <span class="track"></span>
      نمایش در همین صفحه
    </label>
    <button class="icon-btn" id="themeBtn" title="تغییر تم">🌙</button>
  </div>

  <p class="hint">
    <kbd>Ctrl</kbd> + <kbd>K</kbd> برای فوکوس روی جستجو &nbsp;•&nbsp; <kbd>/</kbd> هم کار می‌کند &nbsp;•&nbsp; <kbd>Esc</kbd> برای بستن نمایش
    <br>
    اگر متن شبیه آدرس باشد، مستقیم باز می‌شود.
  </p>

  <!-- پنجره نمایش داخلی -->
  <div class="frame-wrap" id="frameWrap" hidden>
    <div class="frame-bar">
      <button class="frame-btn close" id="frameClose">✕ بستن</button>
      <div class="frame-url" id="frameUrl"></div>
      <a class="frame-btn" id="frameOpen" href="#" target="_blank" rel="noopener">تب جدید ↗</a>
    </div>
    <iframe id="frame" referrerpolicy="no-referrer"></iframe>
  </div>

<script>
(function () {
  "use strict";

  /* ---------------- موتورهای جستجو ---------------- */
  const ENGINES = [
    { id:"google",    name:"گوگل",        q:"https://www.google.com/search?q=%s",             icon:"G",  color:"#4285f4" },
    { id:"bing",      name:"بینگ",        q:"https://www.bing.com/search?q=%s",                icon:"b",  color:"#0aa1dd" },
    { id:"ddg",       name:"داک‌داک‌گو",  q:"https://duckduckgo.com/?q=%s",                    icon:"D",  color:"#de5833" },
    { id:"brave",     name:"بریو",        q:"https://search.brave.com/search?q=%s",            icon:"B",  color:"#fb542b" },
    { id:"startpage", name:"استارت‌پیج",  q:"https://www.startpage.com/sp/search?query=%s",    icon:"S",  color:"#6573ff" },
    { id:"ecosia",    name:"اکوزیا",      q:"https://www.ecosia.org/search?q=%s",              icon:"E",  color:"#24b36b" },
    { id:"yandex",    name:"یاندکس",      q:"https://yandex.com/search/?text=%s",              icon:"Y",  color:"#ffb300" },
    { id:"yahoo",     name:"یاهو",        q:"https://search.yahoo.com/search?p=%s",            icon:"Y!", color:"#6001d2" },
    { id:"wikipedia", name:"ویکی‌پدیا",   q:"https://fa.wikipedia.org/w/index.php?search=%s",  icon:"W",  color:"#5c6b73" },
    { id:"youtube",   name:"یوتیوب",      q:"https://www.youtube.com/results?search_query=%s", icon:"▶",  color:"#ff0033" },
    { id:"github",    name:"گیت‌هاب",     q:"https://github.com/search?q=%s",                  icon:"⌥",  color:"#57606a" },
    { id:"stack",     name:"استک‌اورفلو", q:"https://stackoverflow.com/search?q=%s",           icon:"≡",  color:"#ef8236" },
    { id:"reddit",    name:"ردیت",        q:"https://www.reddit.com/search/?q=%s",             icon:"r",  color:"#ff4500" },
    { id:"amazon",    name:"آمازون",      q:"https://www.amazon.com/s?k=%s",                   icon:"a",  color:"#ff9900" }
  ];

  /* ---------------- عناصر ---------------- */
  const $ = (id) => document.getElementById(id);
  const form       = $("searchForm");
  const input      = $("q");
  const badge      = $("engineBadge");
  const list       = $("engineList");
  const embedTgl   = $("embedToggle");
  const themeBtn   = $("themeBtn");
  const frameWrap  = $("frameWrap");
  const frame      = $("frame");
  const frameUrl   = $("frameUrl");
  const frameOpen  = $("frameOpen");
  const frameClose = $("frameClose");

  /* ---------------- وضعیت ---------------- */
  let current = localStorage.getItem("mb.engine") || "google";
  let embed   = localStorage.getItem("mb.embed") === "1";
  let theme   = localStorage.getItem("mb.theme") || "dark";

  if (!ENGINES.some(e => e.id === current)) current = "google";

  /* ---------------- ساخت چیپ‌ها ---------------- */
  ENGINES.forEach((eng, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.dataset.id = eng.id;
    btn.title = "کلید میان‌بر: Alt + " + (i < 9 ? (i + 1) : "—");

    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = eng.color;
    dot.textContent = eng.icon;

    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(eng.name));
    btn.addEventListener("click", () => selectEngine(eng.id));

    list.appendChild(btn);
  });

  function selectEngine(id) {
    current = id;
    localStorage.setItem("mb.engine", id);
    const eng = ENGINES.find(e => e.id === id) || ENGINES[0];

    badge.textContent = eng.icon;
    badge.style.background = eng.color;

    document.querySelectorAll(".chip").forEach(c => {
      c.classList.toggle("active", c.dataset.id === id);
    });
    input.focus();
  }

  /* ---------------- تشخیص آدرس ---------------- */
  const URL_RE   = /^(https?:\/\/)\S+$/i;
  const DOMAIN_RE = /^[\w-]+(\.[\w-]+)+(\/\S*)?$/i;

  function buildTarget(raw) {
    const text = raw.trim();

    if (URL_RE.test(text)) return text;
    if (DOMAIN_RE.test(text) && !/\s/.test(text)) return "https://" + text;

    const eng = ENGINES.find(e => e.id === current) || ENGINES[0];
    return eng.q.replace("%s", encodeURIComponent(text));
  }

  /* ---------------- اجرای جستجو ---------------- */
  function runSearch() {
    const raw = input.value.trim();
    if (!raw) { input.focus(); return; }

    const target = buildTarget(raw);

    if (embed) {
      openFrame(target);
    } else {
      window.open(target, "_blank", "noopener");
    }
  }

  function openFrame(url) {
    frameUrl.textContent = url;
    frameOpen.href = url;
    frame.src = url;
    frameWrap.hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeFrame() {
    frameWrap.hidden = true;
    frame.src = "about:blank";
    document.body.style.overflow = "";
    input.focus();
  }

  /* ---------------- رویدادها ---------------- */
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    runSearch();
  });

  embedTgl.checked = embed;
  embedTgl.addEventListener("change", () => {
    embed = embedTgl.checked;
    localStorage.setItem("mb.embed", embed ? "1" : "0");
  });

  frameClose.addEventListener("click", closeFrame);

  /* تم */
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = t === "dark" ? "🌙" : "☀️";
    localStorage.setItem("mb.theme", t);
  }
  applyTheme(theme);

  themeBtn.addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    applyTheme(theme);
  });

  /* کلیدهای میان‌بر */
  document.addEventListener("keydown", (e) => {
    // Ctrl+K یا "/" → فوکوس
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      input.focus();
      input.select();
      return;
    }
    if (e.key === "/" && document.activeElement !== input && document.activeElement.tagName !== "INPUT") {
      e.preventDefault();
      input.focus();
      return;
    }
    // Esc → بستن فریم
    if (e.key === "Escape" && !frameWrap.hidden) {
      closeFrame();
      return;
    }
    // Alt + عدد → انتخاب موتور
    if (e.altKey && /^[1-9]$/.test(e.key)) {
      const idx = parseInt(e.key, 10) - 1;
      if (ENGINES[idx]) {
        e.preventDefault();
        selectEngine(ENGINES[idx].id);
      }
    }
  });

  /* ---------------- شروع ---------------- */
  selectEngine(current);
})();
</script>
</body>
</html>
